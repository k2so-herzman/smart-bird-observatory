# Horus station config
# Copy to /etc/horus/horus.yaml on the Pi and edit.

station: horus
# Must match the actual sensor on this Pi — gets echoed into every
# event payload so downstream can distinguish stations with different
# optics. Horus currently ships an Arducam IMX519 (16MP).
camera: imx519

mqtt:
  host: 192.168.1.87      # Home Assistant Mosquitto
  port: 1883
  # username: sbo
  # password: <set via env or secrets>
  topic_prefix: sbo

capture:
  width: 2304
  height: 1296
  jpeg_quality: 90
  interval_s: 1.0
  rpicam_extra_args: []

  # Picamera2 low-latency path (spike). When both lores_* are positive
  # the daemon opens a persistent picamera2 session, runs a background
  # preview thread at preview_fps, and triggers full-res stills on
  # motion-gate trips (~50-150ms vs ~3-4s for the rpicam fallback).
  # Leaving these unset (or zero) keeps the legacy rpicam-still path
  # unchanged. Requires picamera2 installed in the venv — the daemon
  # falls back to rpicam-still if Camera.start() raises.
  # lores_width: 320
  # lores_height: 180
  # preview_fps: 15

  # Manual focus lock for the picamera2 path. The rpicam `--autofocus-*`
  # flags in rpicam_extra_args only apply to the legacy path — picamera2
  # needs AF set via picam2.set_controls(). A positive value locks
  # AfMode=Manual to that diopter. Zero (default) leaves AF untouched.
  # Empirically: IMX519 feeder at ~33cm focuses cleanly around LP 3.0.
  # lens_position: 2.7

motion:
  pixel_threshold: 25
  frame_fraction: 0.02
  cooldown_s: 5.0

storage:
  # Local ring-buffer only. Images ride MQTT to Banshee — no NFS.
  local_dir: /var/lib/horus/captures
  max_local_mb: 512

heartbeat_interval_s: 60
