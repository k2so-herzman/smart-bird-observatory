# Horus station config
# Copy to /etc/horus/horus.yaml on the Pi and edit.

station: horus
# Must match the actual sensor on this Pi — gets echoed into every
# event payload so downstream can distinguish stations with different
# optics. Horus currently ships an Arducam IMX519 (16MP).
camera: imx519

mqtt:
  host: 192.168.1.87      # Home Assistant Mosquitto
  port: 1883
  # username: sbo
  # password: <set via env or secrets>
  topic_prefix: sbo

capture:
  width: 2304
  height: 1296
  jpeg_quality: 90
  interval_s: 1.0
  rpicam_extra_args: []

motion:
  pixel_threshold: 25
  frame_fraction: 0.02
  cooldown_s: 5.0

storage:
  # Local ring-buffer only. Images ride MQTT to Banshee — no NFS.
  local_dir: /var/lib/horus/captures
  max_local_mb: 512

heartbeat_interval_s: 60
