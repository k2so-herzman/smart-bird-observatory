[project]
name = "horus"
version = "0.1.0"
description = "Smart Bird Observatory capture node"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pillow>=10.0",
    # Shared primitives (topics, timestamps, MQTT config base).
    # During dev: `pip install -e ../shared` before `pip install -e .`.
    "sbo-shared>=0.1.0",
]

[project.scripts]
horus-capture = "horus.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
