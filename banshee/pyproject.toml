[project]
name = "banshee"
version = "0.2.0"
description = "Smart Bird Observatory ingest + aggregator (deployed as thoth)"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0",
    "influxdb-client>=1.40",
    "minio>=7.2",
    "httpx>=0.27",
    "pillow>=10.0",
    # thoth-api read service
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Shared primitives (topics, timestamps, MQTT config base).
    # During dev: `pip install -e ../shared` before `pip install -e .`.
    "sbo-shared>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # TestClient uses httpx
]
# TFLite runtime + numpy for the image classifier. Installed on the
# Thoth LXC (`pip install -e .[classify]`); dev/CI environments can
# skip it — the classifier falls back to DummyClassifier in that case.
classify = [
    "tflite-runtime>=2.14",
    "numpy>=1.26",
]

[project.scripts]
# Historical name — kept for local dev so `banshee --config ./dev.yaml`
# still works on a laptop.
banshee = "banshee.main:main"
# Production entrypoints. Thoth systemd units call these.
thoth-ingest = "banshee.main:main"
thoth-api = "banshee.api:main"
thoth-classify = "banshee.classifier.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
