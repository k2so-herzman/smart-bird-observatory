[project]
name = "banshee"
version = "0.1.0"
description = "Smart Bird Observatory aggregator + classifier"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0",
    "influxdb-client>=1.40",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
# TFLite wiring lands in a later PR.
classify = []

[project.scripts]
banshee = "banshee.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
