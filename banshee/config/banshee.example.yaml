# Banshee / Thoth ingest — dev YAML config
#
# Production deploys DO NOT use this file. The production path is
# env-driven via systemd's `EnvironmentFile=/etc/thoth/env` (see
# banshee/config/thoth.env.example). This YAML is here so you can run
#   banshee --config ./banshee.yaml
# against a laptop test broker without exporting envs by hand.

mqtt:
  host: 192.168.1.73
  port: 1883
  # username: sbo
  # password: <fill in>
  topic_prefix: sbo
  station_filter: "+"

storage:
  db_path: /var/lib/thoth/events.db
  # Media backend: "local" (default) writes blobs to local disk under
  # local.root; "minio" is the legacy object-storage backend and only
  # works if you run your own MinIO server. When `backend` is omitted,
  # local is used unless a minio block is present.
  backend: local
  local:
    root: /var/lib/thoth/media
  # minio:
  #   endpoint: http://192.168.1.65:9000
  #   access_key: ""           # fill in locally, do NOT commit
  #   secret_key: ""
  #   bucket: thoth
  #   secure: false

influx:
  url: http://192.168.1.24:8086
  token: ""                  # fill in locally, do NOT commit
  org: herzman
  bucket: sbo

notify:
  telegram_min_confidence: 0.75
  ha_enabled: true
